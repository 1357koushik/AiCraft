# Base server.properties for harness runs (judged test and benchmark sessions).
# The harness fills in level-name, level-seed, rcon.password and the ports at run time.
accepts-transfers=false
allow-flight=false
allow-nether=true
broadcast-console-to-ops=true
broadcast-rcon-to-ops=true
difficulty=normal
enable-command-block=false
enable-jmx-monitoring=false
enable-query=false
enable-rcon=true
enable-status=true
enforce-secure-profile=false
enforce-whitelist=true
entity-broadcast-range-percentage=100
force-gamemode=false
function-permission-level=2
gamemode=survival
generate-structures=true
generator-settings={}
hardcore=false
hide-online-players=false
initial-disabled-packs=
initial-enabled-packs=vanilla
level-type=minecraft\:normal
log-ips=false
max-chained-neighbor-updates=1000000
max-players=8
max-tick-time=60000
max-world-size=29999984
motd=bot harness
network-compression-threshold=256
online-mode=false
op-permission-level=4
# Keep ticking with nobody online, so timings and observer data stay continuous.
pause-when-empty-seconds=0
player-idle-timeout=0
prevent-proxy-connections=false
pvp=true
rate-limit=0
region-file-compression=deflate
require-resource-pack=false
server-ip=127.0.0.1
simulation-distance=8
spawn-monsters=true
spawn-protection=0
sync-chunk-writes=true
use-native-transport=true
view-distance=10
white-list=true
